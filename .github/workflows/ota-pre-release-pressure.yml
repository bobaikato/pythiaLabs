name: Ota Pre-release Pressure

on:
  push:
    branches:
      - bobai/ota-pre-release-pressure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pressure:
    name: Ota declaration and discovery pressure
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - name: Install Ota from contract source
        uses: ota-run/setup@v1
        with:
          source: contract

      - name: Create pressure artifact directory
        run: mkdir -p .ota/pressure

      - name: Validate proposed contract
        run: |
          set +e
          ota validate . --json > .ota/pressure/validate.json
          printf '%s\n' "$?" > .ota/pressure/validate.exit
          exit 0

      - name: Inspect declared task posture
        run: |
          set +e
          ota tasks --json > .ota/pressure/tasks.json
          printf '%s\n' "$?" > .ota/pressure/tasks.exit
          exit 0

      - name: Diagnose repository readiness
        run: |
          set +e
          ota doctor --json > .ota/pressure/doctor.json
          printf '%s\n' "$?" > .ota/pressure/doctor.exit
          exit 0

      - name: Re-run conservative discovery
        run: |
          set +e
          ota detect --candidate-out .ota/pressure/detect-candidate.json --json . > .ota/pressure/detect.json
          printf '%s\n' "$?" > .ota/pressure/detect.exit
          exit 0

      - name: Require the expected declaration gates
        run: |
          test "$(cat .ota/pressure/validate.exit)" -eq 0
          test "$(cat .ota/pressure/tasks.exit)" -eq 0
          test "$(cat .ota/pressure/detect.exit)" -eq 0

      - name: Retain Ota pressure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ota-pre-release-pressure-${{ github.run_id }}
          path: .ota/pressure
          if-no-files-found: warn
