name: Ota Pre-release Container Pressure

on:
  push:
    branches:
      - bobai/ota-pre-release-pressure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-pressure:
    name: Ota Linux container execution matrix
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Ota from contract source
        uses: ota-run/setup@493cba84bf7f7c11c9e8e996d832d93a89c62184 # v1.0.8
        with:
          source: contract

      - name: Create pressure artifact directory
        run: mkdir -p .ota/pressure/container

      - name: Record container engine posture
        run: docker version --format '{{json .}}' > .ota/pressure/container/docker-version.json

      - name: Run declared portable container lanes
        shell: bash
        run: |
          set +e
          run_lane() {
            local lane="$1"
            ota run "$lane" --mode container --stream > ".ota/pressure/container/${lane//:/-}.log" 2>&1
            printf '%s\n' "$?" > ".ota/pressure/container/${lane//:/-}.exit"
          }
          run_lane verify:mcp-smoke
          run_lane verify:site-build
          docker image inspect 'node:20-bookworm@sha256:cacf10e99285cbbc891452e31249c1b5ec3ba225f40028fae946b75aeaf1b66a' \
            > .ota/pressure/container/node-image.json 2>&1
          exit 0

      - name: Require every selected container lane to pass
        shell: bash
        run: |
          for result in .ota/pressure/container/verify-*.exit; do
            test "$(cat "$result")" -eq 0
          done

      - name: Retain Ota container-pressure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ota-pre-release-container-pressure-${{ github.run_id }}
          path: .ota/pressure/container
          if-no-files-found: warn
